name: Linux build and validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install distribution dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build libsqlite3-dev libyaml-cpp-dev nlohmann-json3-dev libspdlog-dev libcli11-dev libboost-system-dev libgtest-dev curl jq clang-format-18 clang-tidy-18
      - name: Configure
        run: |
          if [ '${{ matrix.compiler }}' = clang ]; then export CC=clang CXX=clang++; else export CC=gcc CXX=g++; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - name: Formatting
        if: matrix.compiler == 'clang'
        run: find include src apps tests plugin_sdk -type f \( -name '*.hpp' -o -name '*.cpp' -o -name '*.h' -o -name '*.c' \) -print0 | xargs -0 clang-format-18 --dry-run --Werror
      - name: clang-tidy
        if: matrix.compiler == 'clang'
        run: |
          jq -r '.[].file | select(endswith(".cpp"))' build/compile_commands.json |
            sort -u | xargs -r -n 1 clang-tidy-18 -p build
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libsqlite3-dev libyaml-cpp-dev nlohmann-json3-dev libspdlog-dev libcli11-dev libboost-system-dev libgtest-dev curl jq
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLASO_ENABLE_ASAN=ON -DLASO_ENABLE_UBSAN=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  debian:
    runs-on: ubuntu-24.04
    container: debian:13
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y git ca-certificates build-essential cmake ninja-build libsqlite3-dev libyaml-cpp-dev nlohmann-json3-dev libspdlog-dev libcli11-dev libboost-system-dev libgtest-dev curl jq
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: laso_test
          POSTGRES_USER: laso_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laso_ci -d laso_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libsqlite3-dev libyaml-cpp-dev nlohmann-json3-dev libspdlog-dev libcli11-dev libboost-system-dev libgtest-dev libpq-dev libpqxx-dev clang-tidy-18 curl jq
      - name: Configure PostgreSQL build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DLASO_ENABLE_POSTGRES=ON
      - run: cmake --build build --parallel 2
      - name: clang-tidy PostgreSQL build
        run: |
          jq -r '.[].file | select(endswith(".cpp"))' build/compile_commands.json |
            sort -u | xargs -r -n 1 clang-tidy-18 -p build
      - name: Run SQLite and PostgreSQL storage/runtime tests
        run: ctest --test-dir build --output-on-failure
        env:
          LASO_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 dbname=laso_test user=laso_ci
